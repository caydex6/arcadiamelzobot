name: Controlla programmazione Arcadia

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti: è il minimo consentito da GitHub (può ritardare)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcadia-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEMAS: melzo,bellinzago   # cinema attivi di default, poi si cambiano con /track
          # WATCH: "odissea,matrix"   # opzionale: filtra i nuovi orari per titolo
        run: python bot.py

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name "arcadia-bot"
          git config user.email "arcadia-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Aggiorna stato" && git pull --rebase && git push)
