name: Controlla programmazione Arcadia

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcadia-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEMAS: melzo
          # WATCH: "odissea,matrix"   # opzionale: filtra i nuovi orari per titolo
        run: python bot.py

      - name: Salva lo stato
        run: |
          git config user.name "arcadia-bot"
          git config user.email "arcadia-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Aggiorna stato" && git push)
